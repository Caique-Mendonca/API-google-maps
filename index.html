<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Google Maps Aplicação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mapa dos blocos da unifor</h1>
    </header>
    <section>
        <div id="map"></div>
        <div class="blocos">
            <div><p>Bloco A</p> <button class="botao-ver" type="button" data-bloco="A" >Ver</button></div>
            <div><p>Bloco B</p> <button class="botao-ver" type="button" data-bloco="B" >Ver</button></div>
            <div><p>Bloco C</p> <button class="botao-ver" type="button" data-bloco="C" >Ver</button></div>
            <div><p>Bloco D</p> <button class="botao-ver" type="button" data-bloco="D" >Ver</button></div>
            <div><p>Bloco E</p> <button class="botao-ver" type="button" data-bloco="E" >Ver</button></div>
            <div><p>Bloco F</p> <button class="botao-ver" type="button" data-bloco="F" >Ver</button></div>
            <div><p>Bloco H</p> <button class="botao-ver" type="button" data-bloco="H" >Ver</button></div>
            <div><p>Bloco I</p> <button class="botao-ver" type="button" data-bloco="I" >Ver</button></div>
            <div><p>Bloco J</p> <button class="botao-ver" type="button" data-bloco="J" >Ver</button></div>
            <div><p>Bloco K</p> <button class="botao-ver" type="button" data-bloco="K" >Ver</button></div>
            <div><p>Bloco L</p> <button class="botao-ver" type="button" data-bloco="L" >Ver</button></div>
            <div><p>Bloco M</p> <button class="botao-ver" type="button" data-bloco="M" >Ver</button></div>
            <div><p>Bloco N</p> <button class="botao-ver" type="button" data-bloco="N" >Ver</button></div>
            <div><p>Bloco O</p> <button class="botao-ver" type="button" data-bloco="O" >Ver</button></div>
            <div><p>Bloco P</p> <button class="botao-ver" type="button" data-bloco="P" >Ver</button></div>
            <div><p>Bloco Q</p> <button class="botao-ver" type="button" data-bloco="Q" >Ver</button></div>
            <div><p>Bloco R</p> <button class="botao-ver" type="button" data-bloco="R" >Ver</button></div>
            <div><p>Bloco T</p> <button class="botao-ver" type="button" data-bloco="T" >Ver</button></div>
            <div><p>Bloco X</p> <button class="botao-ver" type="button" data-bloco="X" >Ver</button></div>
            <div style="border-bottom: solid 1px gray;"><p>Bloco Z</p> <button class="botao-ver" type="button" data-bloco="Z" >Ver</button></div>
        </div>

    </section>

    <script src="index.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCo1_6seG9nFzEdnDafrWRXGGmaij452Ik&callback=initMap" async defer></script>
</body>
</html>
